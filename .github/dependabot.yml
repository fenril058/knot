# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7

    open-pull-requests-limit: 5

    # @playwright/test は flake.nix の playwright-driver.browsers と対で動く。
    # 片方だけ上がるとブラウザのバージョンが合わず e2e が落ちるため、
    # Dependabot には触らせず flake.lock の更新と一緒に手で上げる。
    ignore:
      - dependency-name: "@playwright/test"
      # 7.0.2002 / 7.0.2003 では、type-aware rule の oxlint-disable-next-line が効かない
      # （oxc-project/oxc#27084、#213）。直った版が出たら自動で戻るよう exact version で外す。
      - dependency-name: "oxlint-tsgolint"
        versions: ["7.0.2002", "7.0.2003"]
      # 1.86.0 は peer dependency に oxlint-tsgolint >=7.0.2003 を要求する。
      - dependency-name: "oxlint"
        versions: ["1.86.0"]

    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7

    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7

    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
