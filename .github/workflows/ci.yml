name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR は refs/pull/<番号>/merge ごとに最新の実行だけを残す。
# fork からの PR では event payload が空になり得るので、PR 番号ではなく github.ref を使う。
# push は run_id で実行ごとに別の group にし、待機中の実行も置き換えられないようにする。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix develop .#workflow --command actionlint -color .github/workflows/*.yml
      - run: nix develop .#workflow --command zizmor --strict-collection .
      - run: nix develop .#workflow --command ghalint run
      - run: nix develop .#workflow --command pinact run --check --verify-comment
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:dead-code
      - run: npm run check:worker
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix develop . --command node -e 'if (process.versions.node.split(".")[0] !== "26") process.exit(1)'
      - id: e2e
        run: nix develop . --command npm run test:e2e
      # Playwright 自体が失敗したときだけ test-results/ を残す。
      # failure() だけだと前の step の失敗でも走り、test-results/ が無いので upload も失敗する。
      - if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash test/docker-smoke.sh
